# Production profile. Everything sensitive comes from the environment; the base
# application.yml points at localhost for local development only.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # One Neon database is shared across projects, so pin this service to its
      # own schema. Set it on the pool, not via currentSchema in the JDBC URL,
      # and point DB_URL at Neon's DIRECT endpoint (host without -pooler): the
      # pooled endpoint multiplexes per transaction and drops the SET search_path.
      schema: ${DB_SCHEMA:openlens}
      maximum-pool-size: 5
      minimum-idle: 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    schemas: ${DB_SCHEMA:openlens}
    default-schema: ${DB_SCHEMA:openlens}
    create-schemas: true

  data:
    redis:
      # Upstash speaks TLS, so the rediss:// URL replaces host/port.
      url: ${REDIS_URL}

  kafka:
    # Kafka has no free managed option on this stack yet. The broker is
    # unreachable in production: the REST API and cached reads work, but
    # asynchronous repository ingestion does not run. KAFKA_SERVERS is the
    # single switch to point at a real broker once one exists.
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    listener:
      # Do not let a missing broker take the application down at startup.
      missing-topics-fatal: false

server:
  port: ${PORT:8080}

github:
  api:
    token: ${GITHUB_TOKEN:}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}

openlens:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.openlens: INFO
    org.springframework.kafka: WARN
